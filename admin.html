<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة التحكم | بيت الحلو</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { background: #faf5f0; }
    .wrap { width: min(1100px, 94%); margin: 24px auto 60px; }
    .panel { background: #fff; border-radius: 16px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 24px; }
    .panel h2 { margin: 0 0 14px; color: var(--brand-dark); font-size: 1.25rem; }
    .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .bar h1 { margin: 0; font-size: 1.5rem; color: var(--brand-dark); }
    .bar .sp { margin-inline-start: auto; }
    .login { max-width: 360px; margin: 12vh auto; }
    .login label, .pform label { display: block; font-weight: 600; font-size: .9rem; margin-top: 10px; }
    .login input, .pform input, .pform select, .pform textarea, select.st { display: block; width: 100%; margin-top: 4px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: #fffdfb; }
    .pform { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 14px; align-items: end; }
    .pform .full { grid-column: 1 / -1; }
    .pform .chk { display: flex; align-items: center; gap: 8px; margin-top: 26px; }
    .pform .chk input { width: auto; margin: 0; }
    .tbl { width: 100%; border-collapse: collapse; font-size: .92rem; }
    .tbl th, .tbl td { padding: 9px 8px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: top; }
    .tbl th { color: var(--muted); font-size: .8rem; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--accent); }
    .tag.off { background: #eee; color: #777; }
    .sm { border: 0; border-radius: 8px; padding: 5px 12px; font: inherit; font-size: .82rem; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--brand-dark); }
    .sm.danger { background: #fee2e2; color: var(--err); }
    .scroll { overflow-x: auto; }
    .order { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .order-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .order ul { margin: 8px 0; padding-inline-start: 20px; }
    select.st { width: auto; margin: 0; padding: 5px 10px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat { background: #fff; border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px; }
    .stat b { display: block; font-size: 1.5rem; color: var(--brand-dark); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- تسجيل الدخول -->
  <div class="panel login" id="loginView">
    <h2>🔐 لوحة التحكم</h2>
    <form id="loginForm">
      <label>كلمة السر
        <input type="password" id="pw" required autocomplete="current-password" dir="ltr" style="text-align:right">
      </label>
      <p class="form-error" id="loginErr" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">دخول</button>
    </form>
  </div>

  <!-- اللوحة -->
  <div class="wrap hidden" id="dashView">
    <div class="bar">
      <h1>لوحة التحكم</h1>
      <a class="sm" href="/" target="_blank">عرض المتجر ↗</a>
      <button class="sm sp" id="logout" type="button">تسجيل الخروج</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="panel">
      <h2>الطلبات</h2>
      <div id="orders"></div>
    </div>

    <div class="panel">
      <h2 id="formTitle">إضافة منتج جديد</h2>
      <form class="pform" id="productForm">
        <label>اسم المنتج<input name="name" required maxlength="100"></label>
        <label>التصنيف<input name="category" required maxlength="40" list="cats" placeholder="شرقية / غربية / كيك"></label>
        <datalist id="cats"></datalist>
        <label>السعر<input name="price" type="number" min="0" step="1" required></label>
        <label>إيموجي<input name="emoji" maxlength="8" value="🍰"></label>
        <label class="full">الوصف<textarea name="description" rows="2" maxlength="400"></textarea></label>
        <label class="chk"><input type="checkbox" name="available" checked> متوفر للبيع</label>
        <div class="full" style="display:flex;gap:10px;margin-top:14px">
          <button class="btn btn-primary" type="submit" id="saveBtn">حفظ المنتج</button>
          <button class="btn" type="button" id="cancelEdit" style="background:#eee" hidden>إلغاء التعديل</button>
        </div>
      </form>
      <p class="form-error" id="prodErr" role="alert"></p>
    </div>

    <div class="panel">
      <h2>المنتجات</h2>
      <div class="scroll"><table class="tbl" id="prodTable"></table></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="/admin.js"></script>
</body>
</html>
